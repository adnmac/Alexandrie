name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .build
          # Le chemin du dépôt fait partie de la clé : .build garde des chemins absolus, et un cache fait
          # sous l'ancien nom du dépôt casse la compilation.
          key: spm-${{ runner.os }}-${{ github.event.repository.name }}-${{ hashFiles('Package.resolved') }}
      - name: Compiler
        run: scripts/build.sh
      - name: Tester
        run: scripts/test.sh
